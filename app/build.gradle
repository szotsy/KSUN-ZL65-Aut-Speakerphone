apply plugin: 'com.android.application'
android {
    compileSdkVersion 30
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId 'hu.videotour.ksunautospeaker'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 2
        versionName '1.1'
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "KSUN.AutoSpeaker_v${variant.versionName}.apk"
        }
    }
}
